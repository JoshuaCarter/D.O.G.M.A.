# DOGMA features catalog (common + path mods with MCM / major systems).
#
# Loaded with manifest-third-party.yml + manifest-dogma-tweaks.yml by dogma_mo2_lib.load_manifest.
#
# path: feature under src/<path> (common→src/_common, debug→src/_debug on disk);
#       package zip mo2/packages/<path_key>.zip
# stage: OMIT | DEV | RELEASE
#

common:
  stage: OMIT
  disables: []
  enables: []

Debug:
  stage: DEV
  path: debug
  desc: "DEV ONLY"

Radiation FX:
  stage: RELEASE
  path: fx/radiation
  desc: Customisable radiation FX that tracks your actual irradiation level (like a dosimeter).

Bleed FX:
  stage: DEV
  path: fx/bleed
  desc: Bleed screen FX from two overlapping PPEs, intensity scaled to bleed level.
  settings:
    - video/player/blood_splash: "false" # Anomaly "Bleeding effect"

Health FX:
  stage: DEV
  path: fx/health
  desc: Low-health screen FX from two overlapping PPEs, intensity scaled to missing HP.
  settings:
    - video/player/bleed_effect: "false" # Anomaly "Low health blur"

FPS:
  stage: RELEASE
  path: hud/fps
  desc: Customisable FPS counter with optional graph view.

Minimap Toggle:
  stage: RELEASE
  path: hud/minimap
  desc: Toggle/hold keybind for the minimap.
  disables:
    - 177- Minimap Toggle - RavenAscendant

Stalker ID:
  stage: RELEASE
  path: hud/stalker_id
  desc: "Centered version of \"Identification UI - CrookR\", to show name, rank, and faction icon when looking at stalkers."
  disables:
    - 163- Identification UI - CrookR
    - G.A.M.M.A. Crook's Identification UI Fix

Better Disassemble Keybind:
  stage: DEV
  path: items/disassemble
  desc: Keybind to disassemble items from inventory, with press/hold/drag support.
  disables:
    - 144- Prefer Best Disassembly Tool - Demonized

Better Drop Keybind:
  stage: DEV
  path: items/drop
  desc: Keybind to drop items from inventory, with press/hold/drag support.
  disables:
    - G.A.M.M.A. Press Key to Drop Item

Weapon Stripper:
  stage: RELEASE
  path: items/stripping
  desc: Keybind to strip all attachments/parts from a weapon in one go.

Parts In Stashes:
  stage: DEV
  path: gameplay/parts_in_stashes
  desc: "Weapon parts in white stashes (RNG Attach tier/condition bands). Optional mechanic destock."
  requires:
    - RNG Attach

Workshop Shared Stash:
  stage: DEV
  path: gameplay/shared_stash
  desc: "One shared stash for all portable workshops; 1 workshop per level; carry weight = table + contents."
  requires:
    - Hideout Furniture

Faster Skinning:
  stage: OMIT
  path: gameplay/faster_skinning
  desc: "Faster mutant skinning."

Melee Skinning:
  stage: DEV
  path: gameplay/melee_skinning
  desc: "Heavy knife stab to skin a mutant."
  mcm_set:
    - fddar/skinning/enable: "false"
    - fddar/skinning/auto_loot_all: "true"

PDA Go Away:
  stage: RELEASE
  path: controls/pda_go_away
  desc: Stops the PDA reequipping after closing inventory or teleporting.
  disables:
    - Dorns_Dont_ReEquip_PDA
    - 136- Previous weapon is automatically pulled after closing PDA - Demonized

Campfire Healing:
  stage: RELEASE
  path: gameplay/campfire_healing
  desc: "Heal near campfires when not in combat. Faster than current system and heals limbs if they have temporary health."
  disables:
    - 115- Campfire slowly regens life - arti

Better Exo Power Drain:
  stage: DEV
  path: gameplay/exo_power
  desc: "Replaces Exosuit drain system. No drain when not moving and more drain when moving (compared to base G.A.M.M.A.)."
  enables:
    - 47- Powered Exos - arti

Pose Controls:
  stage: RELEASE
  path: controls/pose_controls
  desc: "Dedicated keys for sprint, crouch, walk, and prone which always set your pose accordingly."

True Prone:
  stage: RELEASE
  path: gameplay/true_prone
  desc: Makes the player model actually go prone rather than just low crouch.
  disables:
    - xrMPE

What the Fuck:
  stage: DEV
  path: gameplay/death_spectator
  desc: "After death, press Tab to see what killed you and read a summary of recent damage sources."

Better Equipable Controls:
  stage: DEV
  path: controls/equipment_controls
  desc: "Dedicated keys for equipping Melee, Pistol, Detector, Geiger Counter, RF Receiver, and Glowsticks."

Dynamic Loadout:
  stage: DEV
  path: gameplay/dynamic_loadout
  desc: "On New Game LoadLoadout, replace stock weapon/ammo/outfit/helmet shop options with scored ones under point caps; leave other loadout items alone. Disables R.N.G. and RNGLO."
  disables:
    - Randomizer for New Game
    - Revolver's New Game Loadout Overhaul
  enables:
    - G.A.M.M.A. Accurate Defense Values
    - G.A.M.M.A. Starting Loadouts

Weapon Tooltips:
  stage: RELEASE
  path: gui/weapon_tooltips
  desc: Adds detailed weapon performance stats to weapon tooltips.
  enables:
    - G.A.M.M.A. Accurate Defense Values

Stealth:
  stage: DEV
  path: gameplay/stealth
  desc: "Player-only visual detection gate: scale stock visibility, pose cutoffs (stand/crouch/prone), optional smooth remap above cutoff. Bottom-center visibility gem. Leaves NPC-vs-NPC vision, sound, and AlifeTactics alone."

True Fast Travel:
  stage: DEV
  path: gameplay/true_fast_travel
  desc: "Real path travel with spectator camera along the route, in-mod time simulation, LoS ambushes, walk-to-discover destinations. Blanks vanilla game_fast_travel so map FT does not return. Optional keybind teleports companions to you."
  disables:
    - 329- Fair Fast Travel - Catspaw
    - 329- Fair Fast Travel 2.7+ - Catspaw
    - 204- Limited Fast Travel (walking is good for your health) - Demonized
    - 218- Quick Companion Teleport (teleports rescue mission targets) - RazorShultz
  requires:
    - Tarkov-like Level Transitions

ADS Zoom:
  stage: RELEASE
  path: gameplay/ads_zoom
  desc: "Brings weapon model closer to camera when ADS (can adjust per gun+sight combo), with defaults for irons/sights/scopes"
  disables:
    - 72- Adjustable Scope View - sneaky

Free Zoom:
  stage: RELEASE
  path: gameplay/free_zoom
  desc: Freely zoom when not ADS or sprinting. Better input support than base G.A.M.M.A. (e.g. scroll wheel).
  disables:
    - 178- Free Zoom - SlowVibe
    - G.A.M.M.A. Free Zoom v3
    - Kute's Free Zoom Rewrite
