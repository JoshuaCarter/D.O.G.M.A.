# DOGMA features catalog (common + path mods with MCM / major systems).
#
# path: feature under src/<path> (common→src/_common, debug→src/_debug on disk)
# stage: OMIT | DEV | RELEASE — local build includes stage >= dev
# default: true|false — FOMOD checkbox hint (ModuleConfig.xml is the real picker)
#

common:
  stage: OMIT
  default: true

Debug:
  stage: OMIT
  default: true
  path: debug
  desc: "DEV ONLY - local builds only; never FOMOD"

MCM Runtime Read Cache:
  stage: DEV
  default: true
  path: perf/mcm_runtime_read_cache
  desc: "Caches ui_mcm.get in Lua while a game is loaded so mods that poll MCM every frame skip axr_options lookups. Off at main menu; refreshes on in-game Accept and set()."

SFX Prefetcher:
  stage: RELEASE
  default: true
  path: perf/sfx_prefetcher
  desc: "Prefetches a generated list of loose mod sounds on load to reduce first-play hitching. Rebuild by running dogma_sfx_prefetch.py in the DOGMA mod folder after changing sound mods."

New Game Layout:
  stage: RELEASE
  default: true
  path: gui/newgame_layout
  desc: "Wider New Game loadout panel. Remembers last-start settings (not loadout); MCM toggles per field, all on by default."

Radiation FX:
  stage: RELEASE
  default: true
  path: gui/fx_radiation
  desc: Customisable radiation FX that tracks your actual irradiation level (like a dosimeter).

Bleed FX:
  stage: RELEASE
  default: true
  path: gui/fx_bleed
  desc: Corner blood HUD overlays (hud_blood atlases), random corners per wound tier.

Health FX:
  stage: RELEASE
  default: true
  path: gui/fx_health
  desc: Desaturates the screen as HP falls; black and white at 0 HP.

FPS:
  stage: RELEASE
  default: true
  path: gui/fps
  desc: Customisable FPS counter with optional graph view.

UI Toggles:
  stage: RELEASE
  default: true
  path: gui/ui_toggles
  desc: "Hold/toggle keys for minimap and companion health bars. Hidden unless the key shows them."

Stalker ID:
  stage: RELEASE
  default: true
  path: gui/stalker_id
  desc: "Centered version of \"Identification UI - CrookR\", to show name, rank, and faction icon when looking at stalkers."

Invictus Checker:
  stage: RELEASE
  default: true
  path: gui/invictus_checker
  desc: "Every 5s, check whether Invictus is still possible. If it becomes impossible, show Clamitas on screen for 30s."

Reactive BHS:
  stage: RELEASE
  default: true
  path: gui/bhs_reactive
  desc: "Hide classic BHS and status icons by default; show BHS on limb damage or hold key; show opted-in status icons when not grey (with grey grace). Thirst blur starts at yellow (toggle)."

Inventory Controls:
  stage: RELEASE
  default: true
  path: input/inventory_controls
  desc: Hold keybinds to drop, disassemble, transfer, or strip items in inventory. A stacked cell does the whole stack; the stack popup does each hovered row.

Weapons Ban:
  stage: DEV
  default: true
  path: game/weapons_ban
  desc: "Traders won't buy your guns, ammo, or attachments - you must find them in stashes and corpses. Ammo craft: 1 casing + 1 bullet per round; powder is round(vanilla/box) per round."

Toolbench Shared Stash:
  stage: DEV
  default: true
  path: game/shared_stash
  desc: "One shared stash for all crafted toolbenches; max 1 toolbench per map; toolbench weight includes weight of contents."

Faster Skinning:
  stage: RELEASE
  default: true
  path: game/faster_skinning
  desc: "Faster mutant skinning; optional light-slash loot with delayed pickup."

PDA Go Away:
  stage: RELEASE
  default: true
  path: input/pda_go_away
  desc: Stops the PDA reequipping after closing inventory or teleporting.

Menu Controls:
  stage: DEV
  default: true
  path: input/menu_controls
  desc: "Close trade, crafting, and dialogue with a bind (Tab by default) by pulsing Exit."

Campfire Healing:
  stage: RELEASE
  default: true
  path: game/campfire_healing
  desc: "Heal near campfires when not in combat. Faster than current system and heals limbs if they have temporary health."

Badwill:
  stage: OMIT
  default: true
  path: game/badwill
  desc: "Witnessed hits/kills write personal goodwill on nearby same-faction stalkers so high faction standing no longer lets you murder allies unopposed."

DOGMA Mode:
  stage: OMIT
  default: true
  path: game/dogma_mode
  desc: "Replaces New Game Randomize with a D.O.G.M.A. button: Veteran + Survivalist, starter kit, start immediately."

Safety Save:
  stage: RELEASE
  default: true
  path: game/safety_save
  desc: "Named manual save (safety_save) while out of combat: always after a max interval, or after a min cooldown when you open inventory, heal to full, eat, or drink."

Rules:
  stage: RELEASE
  default: false
  path: game/dogma_rules
  desc: "Opt-in: apply and lock other mods' MCM / options / console values from dogma_rules.ltx. Missing target mods are skipped."

Belt Glowsticks:
  stage: RELEASE
  default: true
  path: game/belt_glowsticks
  desc: "Drag a glowstick onto an artefact belt slot to wear it as a light. Double-click equips to belt by default (falls back to hands). Uses the glowstick light_section as-is."

Better Exo Power Drain:
  stage: RELEASE
  default: true
  path: game/exo_power
  desc: "Replaces Exosuit drain system. No drain when not moving and more drain when moving (compared to base G.A.M.M.A.)."

Pose Controls:
  stage: RELEASE
  default: true
  path: input/pose_controls
  desc: "Remaps crouch and prone Controls binds to set pose directly (hold/toggle via MCM). Sprint stays vanilla."

True Prone:
  stage: RELEASE
  default: true
  path: game/true_prone
  desc: Makes the player model actually go prone rather than just low crouch.

Ammo Selector:
  stage: RELEASE
  default: true
  path: game/ammo_selector
  desc: "Optional hold-to-open / release-to-close ammo wheel. Ships GAMMA ammo wheel UI."

Death Report:
  stage: DEV
  default: true
  path: game/death_report
  desc: "On death, press Tab to toggle a summary of recent hits and remaining body health."

Better Equipable Controls:
  stage: RELEASE
  default: true
  path: input/equipment_controls
  desc: "Detector, Geiger, and Torch/Flashlight Controls binds force-equip matching devices into the detector slot."

Pistol Slot:
  stage: RELEASE
  default: true
  path: game/pistol_slot
  desc: "Dedicated engine inventory slot 16 as a pistol holster (pistols still equip to primary/secondary). Adds a Pistol holster key under weapon binds in Settings → Controls."

Weapon Tooltips:
  stage: RELEASE
  default: true
  path: gui/weapon_tooltips
  desc: Adds detailed weapon performance stats to weapon tooltips. Also arms New Game Loadout tooltips, class icons, sort order, and point costs on first open.

Nearby Pickup Labels:
  stage: RELEASE
  default: true
  path: gui/nearby_pickup_labels
  desc: "Auto-show hold-Use style name labels on nearby pickable items (default 3 m, 0–10 m). Off while Use is held. Hides the look-at inventory icon by default."

PDA Filters:
  stage: RELEASE
  default: true
  path: gui/pda_filters
  desc: "MCM toggles to hide PDA / Dynamic News classes (hostile chatter, waypoint complete, kill-witness and loot spam, weather, ...) plus highlight your name in tips."

ADS Zoom:
  stage: RELEASE
  default: true
  path: game/ads_zoom
  desc: "Brings weapon model closer to camera when ADS (can adjust per gun+sight combo), with defaults for irons/sights/scopes. Optional: binoculars start zoomed out."

Free Zoom:
  stage: RELEASE
  default: true
  path: game/free_zoom
  desc: Freely zoom when not ADS. Better input support than base G.A.M.M.A. (e.g. scroll wheel).
