; REFERENCE ONLY — live catalog is config/manifest.yml (defaults: / mods[].defaults)
; (kept for later reference; MO2 jobs and build do not read this file)
;
; DOGMA - default base GAMMA / third-party MCM settings
;
; Each [section] is an MO2 mod name (substring match, same style as disabled.ini).
; If that mod is present in the profile modlist (+ or -), the key=value lines
; under it are written into axr_options.ltx.
;
; Keys default to the [mcm] section. Prefix with @OtherSection/ to target
; another axr_options section, e.g. @lower_weapon_sprint/blacklist = ...
;
; Comment out a line or whole section to skip it.
; Close MO2 before running so it does not overwrite files on exit.

; Examples (uncomment / edit as needed):
;
; [HD Glowsticks]
; glowsticks/loot_chance = 1
; glowsticks/stash_chance = 0.1
;
; [SortingPlus]
; ; (add sortingplus MCM keys here)
