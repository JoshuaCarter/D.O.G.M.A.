# DOGMA third-party mod catalog (Setup wizard + FOMOD requires).
#
# Loaded with manifest-dogma-features.yml + manifest-dogma-tweaks.yml by dogma_mo2_lib.load_manifest.
#
# Fields below are listed in apply order (later steps see earlier results).
#
# 1. stage: OMIT | DEV | RELEASE - wizard / FOMOD gate
# 2. default: true|false - Setup checkbox preselected (absent = false)
# 3. options: radio choices (pack id, or [A, B] composition) - parent only
# 4. requires: / disables: / enables: - install graph + modlist toggles
#       requires entries may be a pack id, or {Pack: {select: […]}} to push
#       BAIN/FOMOD package picks onto that dependency (merged additively if
#       several parents define select for the same dep). Required deps always
#       reinstall so those picks are not skipped as "already present".
# 5. url_download: (+ url_moddb / url_github / url_discord / url_kofi / url_patreon)
#      each link is independent (own wizard icon); url_download is download target
# 6. file_regex: pick GitHub release asset by filename (Python regex, ignore case)
# 7. skip_mo2: download/apply without an MO2 mods/ folder (engine drops, etc.)
# 8. extract archive → mods/<manifest name>  (or temp if skip_mo2)
# 9. select: BAIN/FOMOD packages - merge listed top-level folder contents
#       into the mod root (list order; later wins). Unlisted packages dropped.
#       Also settable under a parent's requires: entry (see #4).
# 10. after_unpack: optional post-extract script
# 11. backup: zip listed paths into newest DOGMA/backups/<stamp>/misc/
#       (skip if already archived; always before moves/overwrite/deletes)
# 12. moves: copy src → dest (replace whole dest tree)
# 13. overwrite: { src: <Anomaly>|<GAMMA> } - merge like Explorer
#       "Replace the files in the destination" (file-level; dirs merge)
#       src may be a dir (bin), file (foo.dll), or glob ("*.dll", "MT/*.dll")
# 14. deletes: <Anomaly>/<GAMMA>/<Mod> paths (zip untouched; after overwrite)
# 15. console: / mcm_reset: / mcm_set: / settings: - game/MCM side effects
#       mcm_reset: MCM key roots (e.g. ssfx_module) → script def= before mcm_set:
#       mcm_set: only when keys are 1:1 with this pack (e.g. blood/* on Painter).
#       Profile-wide MCM deviations live in mcm_config.yml (Alt+U / Setup).
#

# --------------------------------
# ENGINE
# --------------------------------

XRAY Monolith MT:
  stage: RELEASE
  default: true
  url_download: https://github.com/themrdemonized/xray-monolith/releases
  url_github: https://github.com/themrdemonized/xray-monolith/releases
  file_regex: ^STALKER-Anomaly-modded-exes-MT-TEST_[\d.]+\.zip$
  overwrite:
    bin: <Anomaly>
  deletes:
    - <Mod>/bin
    - <Anomaly>/appdata/shaders_cache

