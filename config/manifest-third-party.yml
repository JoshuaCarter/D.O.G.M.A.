# DOGMA third-party mod catalog (Setup wizard + FOMOD depends).
#
# Loaded with manifest-dogma-features.yml + manifest-dogma-tweaks.yml by dogma_mo2_lib.load_manifest.
#
# stage: OMIT | DEV | RELEASE
# Links (each independent — own wizard icon):
#   url_moddb / url_github / url_discord / url_download / url_kofi / url_patreon
# options: radio choices (pack id, or [A, B] composition)
#
Screen Space Shaders:
  stage: RELEASE
  cat: VISUALS
  options:
    - Screen Space Shaders v23
    - Screen Space Shaders v24
    - [Screen Space Shaders v23, Screen Space Shaders v24]
  deletes:
    - <Anomaly>/appdata/shaders_cache

Screen Space Shaders v23:
  stage: OMIT
  cat: VISUALS
  url_moddb: https://www.moddb.com/mods/stalker-anomaly/addons/screen-space-shaders
  url_download: https://www.moddb.com/mods/stalker-anomaly/addons/screen-space-shaders
  disables:
    - 190- Screen Space Shaders 23 - Ascii1457
    - 190- Screen Space Shaders - Ascii1457
    - 190- Screen Space Shaders 15.0 - Ascii1457
    - 190- Screen Space Shaders 7 - Ascii1457
    - 190- Screen Space Shaders latest - Ascii1457

Screen Space Shaders v24:
  stage: OMIT
  cat: VISUALS
  url_kofi: https://ko-fi.com/ascii1457
  archive_name: Screen Space Shaders 24
  enables:
    - 190- Screen Space Shaders 23 - Ascii1457
  disables:
    - 190- Screen Space Shaders - Ascii1457
    - 190- Screen Space Shaders 15.0 - Ascii1457
    - 190- Screen Space Shaders 7 - Ascii1457
    - 190- Screen Space Shaders latest - Ascii1457

