# DOGMA tweaks catalog (path: tweaks/… - always-on / no MCM options).
#
# Loaded with manifest-third-party.yml + manifest-dogma-features.yml by dogma_mo2_lib.load_manifest.
#
# path: feature under src/<path>; package zip mo2/packages/<path_key>.zip
# stage: OMIT | DEV | RELEASE
# default: true|false - Setup / FOMOD checkbox (absent = false)
#

Quieter Bush Rustle SFX For Dark Signal:
  stage: RELEASE
  default: true
  path: tweaks/quieter_bush_rustle_sfx_for_dark_signal
  desc: "Quieter bush rustling sfx for when player brushes against foliage."

Opaque Bushes:
  stage: DEV
  default: true
  path: tweaks/opaque_bushes
  desc: "Bush materials block AI vision completely. Stalkers fighting you in foliage are nudged to solid cover or advance toward you if none is nearby. Omitted: stealth bush coverage bonus replaces hard opacity."

Passive Detector Beeps:
  stage: DEV
  default: true
  path: tweaks/passive_detector_beeps
  desc: "Quiet detector beep every 2s when an artefact is within scanner range while the detector is holstered."

Tweak Ammo Crafting Cost:
  stage: RELEASE
  default: true
  path: tweaks/tweak_ammo_crafting_cost
  desc: Ammo crafting always uses one casing and one bullet per box. Overrides Ammo Maker recipes.
  enables:
    - 145- Ammo Maker - arti
    - 146- Ammo Maker BAS Patch - arti

NVG Sticks After Load:
  stage: DEV
  default: true
  path: tweaks/nvg_sticks_after_load
  desc: "Remember NVG on/off across map changes and loads."

NVG Can Set Default Gain:
  stage: DEV
  default: true
  path: tweaks/nvg_can_set_default_gain
  desc: "Adds an MCM slider to Beef's NVG for starting gain level on NVG use."
  enables:
    - 189- Beef's NVG - theRealBeef

QAW HUD Toggle:
  stage: DEV
  default: true
  path: tweaks/qaw_hud_toggle
  desc: "Add MCM toggle for whether to hide the HUD, or not, for Quick Action Wheel (works with QAW Overhaul)."

Thirst Blur Starts At Yellow:
  stage: DEV
  default: true
  path: tweaks/thirst_blur_starts_at_yellow
  desc: "Thirst blur starts at yellow instead of gray."

Hide Geiger Screen Text:
  stage: DEV
  default: true
  path: tweaks/hide_geiger_screen_text
  desc: "Hides the \"mSv\" screen text when first equipping the Geiger Counter."
  disables:
    - G_FLAT's Msv Above Radiation Icon

Hide Pickup Item Icons:
  stage: DEV
  default: true
  path: tweaks/hide_pickup_item_icons
  desc: "Hides the floating inventory icon when looking at a pickable item. Hold-Use item name text is unchanged."

Medik Tracks Bleed And Rads:
  stage: DEV
  default: true
  path: tweaks/medik_tracks_bleed_and_rads
  desc: "Changes Medik to show icons/counts for rad/bleed (current level, restore rate, protection level)."
  requires:
    - Medik Health Monitor

Fix Damage Limb Allocation:
  stage: DEV
  default: true
  path: tweaks/fix_damage_limb_allocation
  desc: "Fixes damage from being applied to the wrong limb - whatever bone is hit will take the damage (with limited sensible exception)."

Fix Geiger For Dynamic Rad Patches:
  stage: DEV
  default: true
  path: tweaks/fix_geiger_for_dynamic_rad_patches
  desc: "Geiger Counter reads Dynamic Radiation Patch levels (env mode)."
  enables:
    - G.A.M.M.A. Radiation Dynamic Areas

New Game Defaults To Hard:
  stage: DEV
  default: true
  path: tweaks/new_game_defaults_to_hard
  desc: New game defaults to Veteran difficulty and Survivalist economy (you can still change it).

Fix System Keybinds Not Sticking:
  stage: DEV
  default: true
  path: tweaks/fix_system_keybinds_not_sticking
  desc: "No more resetting system keybinds to default values after restart."

No Afterglow Delay:
  stage: DEV
  default: true
  path: tweaks/no_afterglow_delay
  desc: Unlocks Afterglow as soon as Mortal Sin is completed.

RF Mission Can Spawn On Current Map:
  stage: DEV
  default: true
  path: tweaks/rf_mission_can_spawn_on_current_map
  desc: RF packages can spawn on the map you are on. Needs Tweaki_Breeki / Cookbook RF packages.
  enables:
    - 154- RF Receiver Tasks - Tweaki_Breeki
    - 332- QoL Patch to Tweak_Breeki's RF Receiver Hidden Packages - Cookbook

Clear MCM Search Box:
  stage: RELEASE
  default: true
  path: tweaks/clear_mcm_search_box
  desc: Removes pre-filled text from MCM search box.

Fix Mutant Footsteps For Dark Signal:
  stage: DEV
  default: false
  path: tweaks/fix_mutant_footsteps_for_dark_signal
  desc: Routes mutant footsteps onto Dark Signal step banks (paws / hoof / giant / human).
  requires:
    - Dark Signal Soundscape Overhaul Melancholy Edition

Sane NPC Combat Speeds:
  stage: RELEASE
  default: true
  path: tweaks/sane_npc_combat_speeds
  desc: "Resets non-combat NPC speeds to Anomaly defaults. Combat speeds are +20% faster (+50% for ISG)."
  disables:
    - G.A.M.M.A. NPCs Faster Reactions

Escorts Have No Friends:
  stage: DEV
  default: true
  path: tweaks/escorts_have_no_friends
  desc: "Guides and hired escorts join alone."

Bounty Mission Warning Colors:
  stage: DEV
  default: true
  path: tweaks/bounty_mission_warning_colors
  desc: "Marks bounty missions red for same-faction/friendly targets and orange for neutral on the PDA taskboard."

Hide Hostile PDA Chatter:
  stage: DEV
  default: true
  path: tweaks/hide_hostile_pda_chatter
  desc: "Hides ambient Dynamic News broadcast radio from hostile factions (SOS, loot, combat chatter, open-channel tips about them). Direct story/quest tips still come through."

Fix Ammo Wheel Hotkeys:
  stage: DEV
  default: true
  path: tweaks/fix_ammo_wheel_hotkeys
  desc: "Ammo wheel hotkeys skip worn ammo so keys stay 1, 2, 3."
  disables:
    - Fixed Ammo Wheel Hotkeys

Quick Fire:
  stage: DEV
  default: true
  path: tweaks/quick_fire
  desc: Can fire weapon before draw animation fully completes.
  disables:
    - 65- Fluid Aim - Skieppy

Add SortingPlus Keybinds:
  stage: DEV
  default: true
  path: tweaks/add_sortingplus_keybinds
  desc: "SortingPlus favourite/junk MCM keybinds (K/J) and remember lists across new games."
  enables:
    - 110- SortingPlus - RavenAscendant

Dodge Pseudogiant Slam If Airborne:
  stage: RELEASE
  default: true
  path: tweaks/dodge_pseudogiant_slam_if_airborne
  desc: "If your are airborne when a slam happens, you don't take damage (instead of a 200ms window before the slam which is dumb)."

No Controller Tube Spam:
  stage: RELEASE
  default: true
  path: tweaks/no_controller_tube_spam
  desc: "Controller tube attack cooldown is 5s instead of 2s."

Fix New Game Loadout Tooltips:
  stage: RELEASE
  default: true
  path: tweaks/fix_new_game_loadout_tooltips
  desc: "Always-on tooltip fixes for all item types: restacks tooltip sections so extra widgets never overlap or clip, arms the stat builders at the main menu so the first-session New Game Loadout screen shows correct GAMMA/DOGMA tooltips, and shows uses for multi-use items in section-only tooltips (Loadout screen, craft/repair previews)."

Increase Blood Decal Range:
  stage: RELEASE
  default: true
  path: tweaks/increase_blood_decal_range
  desc: "Blood wallmarks appear when shooting from farther away (vanilla cuts out at short range)."
  disables:
    - Long_Range_Blood_Decals

Fix Artifact Weights:
  stage: DEV
  default: true
  path: tweaks/fix_artifact_weights
  desc: "Restores artefact inventory weights from Artefacts Reinvention (weights were commented out in the shipped LTX)."
  enables:
    - G.A.M.M.A. Artefacts Reinvention

Highlight Name In PDA Messages:
  stage: DEV
  default: true
  path: tweaks/highlight_name_in_pda_messages
  desc: "PDA / news tips that mention your character name are highlighted in yellow."

Fix Double Mutant Hits:
  stage: DEV
  default: true
  path: tweaks/fix_double_mutant_hits
  desc: "Ignores a second mutant hit on the actor within 500ms (stops animation-skip double damage from any mutant)."

Bigger New Game Loadout Panel:
  stage: DEV
  default: true
  path: tweaks/bigger_new_game_loadout_panel
  desc: "Makes the new game loadout panel take more space."

Show Loadout Item Points:
  stage: DEV
  default: true
  path: tweaks/show_loadout_item_pts
  desc: "Draws each item's point cost on its icon in the New Game loadout screen. Free (0 pts) items show no number."

Sobre Loadouts:
  stage: DEV
  default: true
  path: tweaks/sobre_loadouts
  desc: "New vanilla-like loadout options"
  disables:
    - Randomizer for New Game
    - Drunks Alternative Starting Loadouts and Companions v
  enables:
    - G.A.M.M.A. Starting Loadouts
