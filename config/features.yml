# DOGMA features catalog.
#
# Key = display title (wizard / docs). Each feature block needs:
#   path: category/feature   — src/ tree + build id (required except common)
# stage: omit | local | release
#   omit    — not built
#   local   — local builds (Ctrl+Shift+B / tools/build.sh)
#   release — local + FOMOD / GitHub release
# common    — always-on (stage ignored)
# disables / enables — exact MO2 folder / modlist names (full name).
#                      List both the generic folder and the G.A.M.M.A. rename when
#                      either may be present (each line is its own exact match).
#                      opt-in partial: substring:Name  (or contains:Name)
# depends: — pack ids from config/mods.yml and/or other feature paths/titles.
#            Installed via DOGMA (Setup) / Dependencies (same pipeline as packs).
#            FOMOD only ships feature gamedata; descriptions note required packs.
# Pack catalog + Setup wizard checkboxes: config/mods.yml
#

