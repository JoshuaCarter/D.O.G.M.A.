; X-Ray v3 ogg comment. Edit this, then:
;   py -3 stamp_ogg_comments.py
; CLI path / --min --max --vol --ai --game-type still override.

[stamp]
dir = sounds/mutant_steps
; Ctor defaults in SoundRender_Source.cpp: min 1, max 300, vol 1.
; 50 was a false match to the 50m step_manager gate (different check).
min_dist = 1
max_dist = 300
base_volume = 1.0
; empty = same as max_dist
max_ai_dist = 300
; SOUND_TYPE_MONSTER_STEP (CreateSounds uses sg_SourceType -> this)
game_type = 0x20008000
