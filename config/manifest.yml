# DOGMA unified catalog — single source of truth.
#
# features:
#   level: off | dev | release   (quote "off" — bare off is YAML false)
#     off     — not built
#     dev     — local builds (Ctrl+Shift+B / tools/build.sh)
#     release — local + FOMOD / GitHub release
#   common    — always-on (level ignored)
#   disable / enable — exact MO2 folder / modlist names (full name).
#                      opt-in partial: substring:Name  (or contains:Name)
#   requirements — third-party mods this feature needs (Install when feature active;
#                  put always-needed packs under common.requirements)
#   defaults  — per-entry MCM; optional target_mod:
#
# suggested: — optional third-party packs (Install+ / --tier all|suggested)
#   keyed by id (same shape as features), not a YAML list

