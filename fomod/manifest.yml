# Feature catalog + FOMOD wizard.
# stage: OMIT | LOCAL | BETA | GOLD  (missing = OMIT)
#   OMIT  - not in local build or FOMOD
#   LOCAL - local build only
#   BETA  - local + FOMOD, checkbox name gets [BETA]
#   OPTIN - local + FOMOD, never preselected
#   GOLD  - local + FOMOD
# mods: common, then page name -> features. Page order = key order.
# recommended: preset ids. Missing: GOLD -> [dogma, dogma-beta], BETA -> [dogma-beta].
#   [] = never prechecked. pick is never in a default list.
# intro: optional first page. One preselected ack (MO2 greys a lone checkbox).
#   name = checkbox. desc = right-pane text. Later pages hidden until ack.
# desc on a feature: FOMOD right-pane text. Missing = feature name.
# image: fomod/images/<path_key>.png  e.g. gui/fps -> gui_fps.png
# common is always-on (not a checkbox). No stage or page.

fomod:
  name: D.O.G.M.A.
  intro:
    name: I have read the installation guide
    desc: |
      FEATURE DETAILS ARE NOT LISTED HERE!
      Use the discord feature list for feature details.

      Discord server: https://discord.gg/bcFeyrkUY7
      Feature list: https://discord.com/channels/1548570119188521032/1549264842752262194

  required:
    - source: gamedata
      dest: gamedata
  presets:
    - id: dogma
      name: D.O.G.M.A.
      type: Recommended
      desc: |
        Preselect all stable features.

        You closely follow the D.O.G.M.A. mod list and want a more stable experience.

    - id: dogma-beta
      name: D.O.G.M.A. BETA
      desc: |
        Preselect all features including beta features.

        You closely follow the D.O.G.M.A. mod list and want beta features.

    - id: pick
      name: Self Serve
      desc: |
        Nothing preselected.

        You may prefer to use manual mode (button in bottom left corner).

