# DOGMA features catalog (common + path mods with MCM / major systems).
#
# Loaded with manifest-third-party.yml + manifest-dogma-tweaks.yml by dogma_mo2_lib.load_manifest.
#
# path: feature under src/<path> (common→src/_common, debug→src/_debug on disk);
#       package zip mo2/packages/<path_key>.zip
# stage: OMIT | DEV | RELEASE
# default: true|false - Setup / FOMOD checkbox (absent = false)
#

common:
  stage: OMIT
  default: true
  requires:
    - xlibs
  disables:
    - 95- Doom-like weapon inspection - Grokitach
  enables: []

Debug:
  stage: OMIT
  default: true
  path: debug
  desc: "DEV ONLY - local builds only; never Setup / FOMOD"

Radiation FX:
  stage: RELEASE
  default: true
  path: fx/radiation
  desc: Customisable radiation FX that tracks your actual irradiation level (like a dosimeter).

Bleed FX:
  stage: DEV
  default: true
  path: fx/bleed
  desc: Corner blood HUD overlays (hud_blood atlases), random corners per wound tier.
  settings:
    - video/player/blood_splash: "false" # Anomaly "Bleeding effect"

Health FX:
  stage: DEV
  default: true
  path: fx/health
  desc: Desaturates the screen as HP falls; black and white at 0 HP.
  settings:
    - video/player/bleed_effect: "false" # Anomaly "Low health blur"

FPS:
  stage: RELEASE
  default: true
  path: hud/fps
  desc: Customisable FPS counter with optional graph view.

Minimap Toggle:
  stage: RELEASE
  default: true
  path: hud/minimap
  desc: Toggle/hold keybind for the minimap.
  disables:
    - 177- Minimap Toggle - RavenAscendant

Stalker ID:
  stage: RELEASE
  default: true
  path: hud/stalker_id
  desc: "Centered version of \"Identification UI - CrookR\", to show name, rank, and faction icon when looking at stalkers."
  disables:
    - 163- Identification UI - CrookR
    - G.A.M.M.A. Crook's Identification UI Fix

Conditional BHS:
  stage: DEV
  default: true
  path: hud/conditional_bhs
  desc: "Show the classic Body Health System HUD on limb damage, while a key is held, and/or while inventory is open."

Better Disassemble Keybind:
  stage: DEV
  default: true
  path: items/disassemble
  desc: Keybind to disassemble items from inventory, with press/hold/drag support.
  disables:
    - 144- Prefer Best Disassembly Tool - Demonized

Better Drop Keybind:
  stage: DEV
  default: true
  path: items/drop
  desc: Keybind to drop items from inventory, with press/hold/drag support.
  disables:
    - G.A.M.M.A. Press Key to Drop Item

Weapon Stripper:
  stage: RELEASE
  default: true
  path: items/stripping
  desc: Keybind to strip all attachments/parts from a weapon in one go.

Belt Glowsticks:
  stage: DEV
  default: true
  path: items/belt_glowsticks
  desc: "Drag a glowstick onto an artefact belt slot to wear it as a light. Detector-slot hold/throw and existing keybinds unchanged."
  disables:
    - contains:Belt Glowsticks

Weapons Ban:
  stage: DEV
  default: true
  path: gameplay/weapons_ban
  desc: "Traders won't buy your guns, ammo, or attachments - you must find them in stashes and corpses."
  disables:
    - Parts In Stashes

Toolbench Shared Stash:
  stage: DEV
  default: true
  path: gameplay/shared_stash
  desc: "One shared stash for all crafted toolbenches; max 1 toolbench per map; toolbench weight includes weight of contents."
  enables:
    - 245- Hideout Furniture - Aoldri

Faster Skinning:
  stage: RELEASE
  default: true
  path: gameplay/faster_skinning
  desc: "Faster mutant skinning; optional light-slash loot with delayed pickup."

PDA Go Away:
  stage: RELEASE
  default: true
  path: controls/pda_go_away
  desc: Stops the PDA reequipping after closing inventory or teleporting.
  disables:
    - Dorns_Dont_ReEquip_PDA
    - 136- Previous weapon is automatically pulled after closing PDA - Demonized

Campfire Healing:
  stage: RELEASE
  default: true
  path: gameplay/campfire_healing
  desc: "Heal near campfires when not in combat. Faster than current system and heals limbs if they have temporary health."
  disables:
    - 115- Campfire slowly regens life - arti

Better Exo Power Drain:
  stage: DEV
  default: true
  path: gameplay/exo_power
  desc: "Replaces Exosuit drain system. No drain when not moving and more drain when moving (compared to base G.A.M.M.A.)."
  enables:
    - 47- Powered Exos - arti

Pose Controls:
  stage: RELEASE
  default: true
  path: controls/pose_controls
  desc: "Remaps crouch and prone Controls binds to set pose directly (hold/toggle via MCM). Sprint stays vanilla."

True Prone:
  stage: RELEASE
  default: true
  path: gameplay/true_prone
  desc: Makes the player model actually go prone rather than just low crouch.
  disables:
    - xrMPE

Pose Visibility:
  stage: DEV
  default: true
  path: gameplay/pose_visibility
  desc: "Max visibility cap on Stealth mod step_incr per pose (stand/crouch/prone); outside Stealth formula."

Ammo Selector:
  stage: DEV
  default: true
  path: gameplay/ammo_selector
  desc: "Optional hold-to-open / release-to-close ammo wheel. Ships GAMMA ammo wheel UI."

Death Report:
  stage: DEV
  default: true
  path: gameplay/death_report
  desc: "On death, press Tab to toggle a summary of recent hits and remaining body health."

Better Equipable Controls:
  stage: DEV
  default: true
  path: controls/equipment_controls
  desc: "Detector, Geiger, and Torch/Flashlight Controls binds force-equip matching devices into the detector slot."

Pistol Slot:
  stage: DEV
  default: true
  path: gameplay/pistol_slot
  desc: "Dedicated engine inventory slot 15 as a pistol holster (pistols still equip to primary/secondary). Adds a Pistol holster key under weapon binds in Settings → Controls."
  disables:
    - 113- Knife Pistol in Binocular Slot - RavenAscendant

Weapon Tooltips:
  stage: RELEASE
  default: true
  path: gui/weapon_tooltips
  desc: Adds detailed weapon performance stats to weapon tooltips.
  enables:
    - G.A.M.M.A. Accurate Defense Values

Nearby Pickup Labels:
  stage: DEV
  default: true
  path: gui/nearby_pickup_labels
  desc: "Auto-show hold-Use style name labels on nearby pickable items (0–10 m). Off while Use is held."

True Fast Travel:
  stage: DEV
  default: true
  path: gameplay/true_fast_travel
  desc: "Real path travel with spectator camera along the route, in-mod time simulation, LoS ambushes, walk-to-discover destinations. Blanks vanilla game_fast_travel so map FT does not return. Optional keybind teleports companions to you."
  disables:
    - 329- Fair Fast Travel - Catspaw
    - 329- Fair Fast Travel 2.7+ - Catspaw
    - 204- Limited Fast Travel (walking is good for your health) - Demonized
    - 218- Quick Companion Teleport (teleports rescue mission targets) - RazorShultz
  requires:
    - Tarkov-like Level Transitions

ADS Zoom:
  stage: RELEASE
  default: true
  path: gameplay/ads_zoom
  desc: "Brings weapon model closer to camera when ADS (can adjust per gun+sight combo), with defaults for irons/sights/scopes"
  disables:
    - 72- Adjustable Scope View - sneaky

Free Zoom:
  stage: RELEASE
  default: true
  path: gameplay/free_zoom
  desc: Freely zoom when not ADS. Better input support than base G.A.M.M.A. (e.g. scroll wheel).
  disables:
    - 178- Free Zoom - SlowVibe
    - G.A.M.M.A. Free Zoom v3
    - Kute's Free Zoom Rewrite
