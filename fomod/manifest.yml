  # QUALITY OF LIFE

  game/faster_skinning:
    name: Faster Skinning
    stage: GOLD
    page: Quality of Life
    desc: |
      Adds a few ways to speed up skinning without losing immersion.
      If note is the ability to draw your knife and slash a mutant to skin it.

  game/exo_power:
    name: Better Exo Power Drain
    stage: BETA
    page: Quality of Life
    desc: |
      No longer drains exo power when idle, but uses more power when moving.

  game/belt_glowsticks:
    name: Belt Glowsticks
    stage: GOLD
    page: Gameplay
    desc: |
      You can now drag glowsticks into a belt slot so you can have light with both hands free.
      Glowstick light intensity is reduced by 50%
      Glowstick ranges changed from 8/10/12/24m to 12/14/16/20m

  # PERFORMANCE

  perf/mcm_runtime_read_cache:
    name: MCM Runtime Read Cache
    stage: GOLD
    page: Performance
    desc: |
      Did you know that many mods absolutely hammer mcm read ops at runtime, wasting precious millis? For shame!
      Adds a Lua middle-man to cache mcm config reads and cache the values for 0 cost subsequent reads.
      Doesn't prevent changes to mcm config at anytime, just avoids the overhead of spamming engine calls.

  perf/sfx_prefetcher:
    name: SFX Prefetcher
    stage: GOLD
    page: Performance
    desc: |
      Adds an SFX prefetcher that actually works.
      Run the <GAMMA>/mods/DOGMA/dogma_sfx_prefetch.py script to compile a list of small sfx files (recomment default 50kb).
      The mod will read that list on game load and preload those sfx files. Rerun script if you change audio packs, etc.

