; DOGMA MO2 pre-launch steps (cwd = MO2 instance root when registered correctly).
; One command per line. Blank lines and ; comments are ignored.
;
; Paths:
;   Relative commands resolve against mods/DOGMA/mo2/ first, then cwd.
;   Use quotes for paths with spaces.
;
; Examples:
;   build_sound_prefetch.bat
;   "C:\gamma_dev\DOGMA\tools\disable_blacklisted_mods.bat" --force --no-pause --disable-only
;
; disable_blacklisted_mods edits modlist.txt — with MO2 open, prefer a separate
; executable run while MO2 is closed. --force is required if you insist on
; running it from pre-launch (MO2 may overwrite the list on exit).

build_sound_prefetch.bat
