# DOGMA unified catalog — single source of truth.
#
# features:
#   stage: omit | local | release
#     omit    — not built
#     local   — local builds (Ctrl+Shift+B / tools/build.sh)
#     release — local + FOMOD / GitHub release
#   common    — always-on (stage ignored)
#   disabled / enables — exact MO2 folder / modlist names (full name).
#                        opt-in partial: substring:Name  (or contains:Name)
#   downloads — third-party packs to install when this feature is present
#               (keyed by id; url: prefer ModDB addon *page* links)
#   defaults  — per-entry MCM; optional target_mod:
#
# suggested: — optional third-party packs (Install+ / --tier all|suggested)
#   same shape as feature downloads entries (disabled / enables / url / ...)

