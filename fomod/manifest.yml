# Feature catalog + FOMOD wizard.
# stage: OMIT | LOCAL | BETA | GOLD  (missing = OMIT)
#   OMIT  - not in local build or FOMOD
#   LOCAL - local build only
#   BETA  - local + FOMOD, checkbox name gets [BETA]
#   OPTIN - local + FOMOD, never preselected
#   GOLD  - local + FOMOD
# page: FOMOD wizard page. First-seen page order. stage still gates the zip.
# recommended: preset ids. Missing: GOLD -> [dogma, dogma-beta], BETA -> [dogma-beta].
#   [] = never prechecked. pick is never in a default list.
# intro: optional first page. Checkbox. desc is the right-pane text.
# desc on a feature: FOMOD right-pane text. Missing = feature name.
# image: fomod/images/<path_key>.png  e.g. gui/fps -> gui_fps.png
# common is always-on (not a checkbox). No stage or page.

fomod:
  name: D.O.G.M.A.
  intro:
    name: I CAN READ!
    desc: |
      READ ME FIRST!

      Enlarged this window to bettter read text and see images.

      D.O.G.M.A. Mod List: https://docs.google.com/spreadsheets/d/1iJBikJQvdHkTJ061XSbtOK3Gj6-Q8PVQ0tH8To23Kt4/edit?usp=sharing

      This modpack is specifically built and tested with the D.O.G.M.A. mod list (on an anotherwise unmodified G.A.M.M.A. base).

      Thus, DO NOT BLINDLY INSTALL this entire modpack and expect it to work flawlessly with your busted-ass setup (some features are fixes for mods in the list, etc).

      If you're NOT following the D.O.G.M.A. mod list, then choose with care the features you want to install.

      If you have issues, I don't want to know about it unless you provide debug logs (enable in mcm) or reliable reproduction steps.

  required:
    - source: gamedata
      dest: gamedata
  presets:
    - id: dogma
      name: D.O.G.M.A.
      desc: |
        You closely follow the D.O.G.M.A. mod list and want a more stable experience.
        All non-beta features preselected.
      type: Recommended
    - id: dogma-beta
      name: D.O.G.M.A. BETA
      desc: |
        You closely follow the D.O.G.M.A. mod list and want beta features.
        Everything preselected.
    - id: pick
      name: Pick and choose
      desc: Nothing preselected.

mods:
  common:
    name: Common

  # WEAPONS BAN

  game/weapons_ban:
    name: Weapons Ban
    stage: BETA
    page: Weapons Ban
    desc: |
      According to G.A.M.M.A. lore, weapons trading is banned. And now traders act like it.
      Traders no longer buy/sell weapon attachments, parts, repair kits, cleaning kits, or ammo.
      You will only find these items in stashes and on corpses. In particular, ammo will now drop in more believable amounts.
      Starting weapons are now poorer condition (59% parts) making the hunt for green barrels all the more rewarding.
      This DOES make the early game more challenging, but not to an extreme degree.

  tweaks/sobre_loadouts:
    name: Sobre Loadouts
    stage: BETA
    page: Weapons Ban
    desc: |
      Complete rework of loadout options which maximises starting options, without compromising balance.
      Each faction has unique options and largely respects their Nato/Warsaw preferences.
      All weapons are A or B grade, and cost is relative to their actual performance.
      Crucially, adds the gunsmithing tools to the loadout options for weapons ban mod.
      [BETA] More balance testing needed.

  gui/newgame:
    name: New Game Layout
    stage: BETA
    page: Weapons Ban
    desc: |
      Changes the new game screen to give the loadout/inventory sections much more room.
      [BETA] Only tested on 16x9 aspect ratio at 4k.

