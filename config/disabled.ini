; REFERENCE ONLY — live catalog is config/manifest.yml
; (kept for later reference; MO2 jobs and build do not read this file)
;
; DOGMA - mods to disable in Mod Organizer 2
;
; Each [section] is a DOGMA feature path (same keys as config/manifest.ini).
; That feature lists other MO2 mods it wants disabled while it is installed.
; Several features may list the same mod; it is only disabled once.
;
; One mod name per line. Comment out a line to skip it.
;
; The script only applies a section when that feature is on in manifest.ini
; (value >= 1). Names match MO2 mod folder names as case-insensitive substrings;
; prefix with exact: for a full-name match only.
;
; Close MO2 before running so it does not overwrite the profile on exit.

