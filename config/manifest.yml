# DOGMA unified mod catalog (Setup wizard + FOMOD + depends).
#
# Single list for third-party packs and local D.O.G.M.A. path mods.
#
# Each block is ONE of:
#   A) Wizard/FOMOD mod — stage: release|dev + url:/buy_url: OR path:
#   B) Radio group — stage: release|dev + options: [choices]
#   C) Composition choice — depends: [mods…]
#   D) Leaf child — stage: omit + url/buy_url or path effects only
#
# stage: omit | dev | release
#   omit    — not in FOMOD, not in wizard
#   dev     — FOMOD + wizard locally only (not in release)
#   release — FOMOD + wizard everywhere
#
# path: local feature under src/<path>; package zip mo2/packages/<path_key>.zip
# url: ModDB or GitHub (auto-download). Omit url: for a manual archive
#      (user places downloads/DOGMA/<id or archive_name>.zip).
# buy_url: paid storefront only (never ModDB/GitHub).

Screen Space Shaders:
  stage: release
  cat: Environment
  options:
    - SSS v23
    - SSS v24
    - SSS v23 + v24
  deletes:
    - <Anomaly>/appdata/shaders_cache

SSS v23:
  stage: omit
  url: https://www.moddb.com/mods/stalker-anomaly/addons/screen-space-shaders
