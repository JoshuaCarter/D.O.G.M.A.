# DOGMA unified mod catalog (Setup wizard + FOMOD + depends).
#
# Single list for third-party packs and local D.O.G.M.A. path mods.
#
# Each block is ONE of:
#   A) Wizard/FOMOD mod — stage: RELEASE|DEV + url_*: OR path:
#   B) Radio group — stage: RELEASE|DEV + options: [choices]
#   C) Composition choice — depends: [mods…]  (or inline under options:)
#   D) Leaf child — stage: OMIT + url_* or path effects only
#
# stage: OMIT | DEV | RELEASE
#   OMIT    — not in FOMOD, not in wizard
#   DEV     — FOMOD + wizard locally only (not in RELEASE)
#   RELEASE — FOMOD + wizard everywhere
#
# path: local feature under src/<path>; package zip mo2/packages/<path_key>.zip
# Links (each independent — own wizard icon; a mod may set all of them):
#   url_moddb:    ModDB page (opens in browser)
#   url_github:   GitHub page (opens in browser)
#   url_discord:  Discord message/channel (opens; link archive with 📁)
#   url_download: ModDB or GitHub file/release URL (MO2 auto-download)
#   url_kofi:     Ko-fi page (opens in browser)
#   url_patreon:  Patreon page (opens in browser)
#
# options: radio choices. Each entry is one exclusive pick:
#   - Pack A
#   - [Pack A, Pack B]          # install both (inline composition)
#   -                           # same, nested list form
#     - Pack A
#     - Pack B

