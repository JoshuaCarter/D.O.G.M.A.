  stage: omit
  buy_url: https://ko-fi.com/ascii1457
  archive_name: Screen Space Shaders 24
  enables:
    - 190- Screen Space Shaders 23 - Ascii1457
  disables:
    - 190- Screen Space Shaders - Ascii1457
    - 190- Screen Space Shaders 15.0 - Ascii1457
    - 190- Screen Space Shaders 7 - Ascii1457
    - 190- Screen Space Shaders latest - Ascii1457

SSS v23 + v24:
  stage: omit
  depends:
    - SSS v23
    - SSS v24
