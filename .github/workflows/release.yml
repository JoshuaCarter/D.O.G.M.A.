name: Release

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display / zip names
        id: name
        run: |
          # Player-facing title vs plain zip basename (repo folder stays DOGMA).
          echo "title=D.O.G.M.A." >> "$GITHUB_OUTPUT"
          echo "filename=DOGMA" >> "$GITHUB_OUTPUT"

      - name: Decide release channel
        id: channel
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          BRANCH="${{ github.ref_name }}"
          TITLE="${{ steps.name.outputs.title }}"
          FILENAME="${{ steps.name.outputs.filename }}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if [[ "$BRANCH" == "main" ]]; then
            VERSION=$(grep -E '^version=' meta.ini | head -1 | cut -d'=' -f2 | tr -d '[:space:]')
            {
              echo "kind=stable"
              echo "version=$VERSION"
              echo "tag=v${VERSION}"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "release_name=${TITLE} v${VERSION}"
              echo "zip_name=${FILENAME} ${VERSION}.zip"
              echo "body="
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "kind=experimental"
              echo "version=exp-${SHORT_SHA}"
              echo "tag=exp-${SHORT_SHA}"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "release_name=${TITLE} experimental ${SHORT_SHA} (${BRANCH})"
              echo "zip_name=${FILENAME} exp-${SHORT_SHA}.zip"
              echo "body<<EOF"
              echo "**Experimental pre-release** from \`${BRANCH}\` @ \`${SHORT_SHA}\`."
              echo ""
              echo "Not a stable/mainline build — for testing only. The repo **Latest** release stays on \`main\`."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check if this tag was already released
        id: check
        run: |
          if git rev-parse "${{ steps.channel.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build FOMOD zip
        if: steps.check.outputs.exists == 'false'
        run: |
          bash tools/package-fomod.sh

          # Stamp experimental builds so MO2 shows the short sha, not mainline version.
          if [[ "${{ steps.channel.outputs.kind }}" == "experimental" ]]; then
            VER="0.0.0-${{ steps.channel.outputs.version }}"
            sed -i -E "s/^version=.*/version=${VER}/" build/fomod/meta.ini
            sed -i -E "s/^newestVersion=.*/newestVersion=${VER}/" build/fomod/meta.ini
            sed -i -E "s#<Version>[^<]*</Version>#<Version>${VER}</Version>#" build/fomod/fomod/info.xml
          fi

          ZIP="${{ steps.channel.outputs.zip_name }}"
          (
            cd build/fomod
            zip -r "../../$ZIP" .
          )

      - name: Create release and attach zip
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.channel.outputs.tag }}
          name: ${{ steps.channel.outputs.release_name }}
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          generate_release_notes: true
          body: ${{ steps.channel.outputs.body }}
          files: |
            ${{ steps.channel.outputs.zip_name }}
            config/manifest.yml
