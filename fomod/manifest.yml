# Feature catalog + FOMOD wizard.
# stage: OMIT | LOCAL | BETA | GOLD  (missing = OMIT)
#   OMIT  - not in local build or FOMOD
#   LOCAL - local build only
#   BETA  - local + FOMOD, checkbox name gets [BETA]
#   OPTIN - local + FOMOD, never preselected
#   GOLD  - local + FOMOD
# mods: common, then page name -> features. Page order = key order.
# recommended: preset ids. Missing: GOLD -> [dogma, dogma-beta], BETA -> [dogma-beta].
#   [] = never prechecked. pick is never in a default list.
# intro: optional first page. Two radios (MO2 greys a lone checkbox).
#   name = ack. refuse = default (optional). desc = right-pane text.
#   Later pages hidden until they pick name.
# desc on a feature: FOMOD right-pane text. Missing = feature name.
# image: fomod/images/<path_key>.png  e.g. gui/fps -> gui_fps.png
# common is always-on (not a checkbox). No stage or page.

fomod:
  name: D.O.G.M.A.
  intro:
    name: I CAN READ!
    desc: |
      READ ME FIRST!

      Tips:
      - Enlarged this window to bettter read text and see images.
      - Hover checkboxes to read descriptions and see images.
      - You can resize the text/image areas as required.
      - If you know exactly what you want, manual mode (bottom-left button) may be more convenient.

      This modpack is specifically built and tested with the D.O.G.M.A. mod list (on an anotherwise unmodified G.A.M.M.A. base).
      Thus, DO NOT BLINDLY INSTALL this entire modpack and expect it to work flawlessly with your busted-ass setup (some features are fixes for mods in the list, etc).
      If you're NOT following the D.O.G.M.A. mod list, then choose with care the features you want to install.

      D.O.G.M.A. Mod List: https://docs.google.com/spreadsheets/d/1iJBikJQvdHkTJ061XSbtOK3Gj6-Q8PVQ0tH8To23Kt4/edit?usp=sharing

      If you have issues, I don't want to know about it unless you provide debug logs (enable in mcm) or reliable reproduction steps.

  required:
    - source: gamedata
      dest: gamedata
  presets:
    - id: dogma
      name: D.O.G.M.A.
      desc: |
        INSTALL PRESET

        You closely follow the D.O.G.M.A. mod list and want a more stable experience.
        All non-beta features preselected.
      type: Recommended
    - id: dogma-beta
      name: D.O.G.M.A. BETA
      desc: |
        INSTALL PRESET

        You closely follow the D.O.G.M.A. mod list and want beta features.
        Everything preselected.
    - id: pick
      name: Pick and choose
      desc: |
        INSTALL PRESET

        Nothing preselected.

mods:
  common:
    name: Common

  Weapons Ban:

    game/weapons_ban:
      name: Weapons Ban
      stage: BETA
      desc: |
        According to G.A.M.M.A. lore, weapons trading is banned. And now traders act like it.

        Traders no longer buy/sell weapon attachments, parts, repair kits, cleaning kits, or ammo.
        You will only find these items in stashes and on corpses. In particular, ammo will now drop in more believable amounts.

        Starting weapons are now poorer condition (59% parts) making the hunt for green barrels all the more rewarding.

        Weapon attachments can now be disassembled for scrap/screws/plastic/glass/electronics.
        Dissassembling weapon kits will also give you random weapon upgrades.

        This DOES make the early game more challenging, but not to an extreme degree.

    tweaks/sobre_loadouts:
      name: New Game Loadout Options
      stage: BETA
      desc: |
        Complete rework of loadout options which maximises starting options, without compromising balance.
        Each faction has unique options and largely respects their Nato/Warsaw preferences.

        All weapons are A or B grade, and cost is relative to their actual performance.

        Crucially, adds the gunsmithing tools to the loadout options for weapons ban mod.

        [BETA] More balance testing needed.

    gui/newgame:
      name: New Game UI
      stage: BETA
      desc: |
        Changes the new game screen to give the loadout/inventory sections much more room.
        Also adds toggles to remember your newgame settings between runs.

        Not important for weapons ban, but makes the expanded loadout a lot nicer to use.

        [BETA] Only tested on 16x9 aspect ratio at 4k.

  Gameplay General:

    game/pistol_slot:
      name: Pistol Slot
      stage: GOLD
      desc: |
        Adds a fully functional pistol slot to the inventory screen. Yes, miracles do happen.

    game/true_prone:
      name: True Prone
      stage: GOLD
      desc: |
        Makes prone actually function like prone, instead of being a low crouch.

        May not play nice with animation/model packs. Disable bone hiding if you stutter.

    game/ads_zoom:
      name: ADS Zoom
      stage: GOLD
      desc: |
        Replaces 'Adjustable Scope View - sneaky'.
        - Adds defaults zoom for irons, sights, scopes.
        - Overrides are saved per weapon/optic type combo (not specific instance of a weapon etc).
        - Adds binoculars default zoomed out option.

    game/free_zoom:
      name: Free Zoom
      stage: GOLD
      desc: |
        Replaces 'Kute's Free Zoom'.
        - Adds mouse inputs and better syncing with ADS zoom.

    game/shared_stash:
      name: Toolbench Universal Stash
      stage: OMIT
      desc: |
        - Makes Toolbench stashes all share their contents.
        - Can only place 1 toolbench per map.
        - Toolbench weight includes contents weight.

        I want to replace this with a custom item/recipe/etc

    game/global_stash:
      name: Global Stash
      stage: LOCAL
      desc: |
        Placeable hideout stash. Every box shares one inventory.

    game/badwill:
      name: Badwill
      stage: LOCAL
      desc: |
        Manages NPC agression toward the player in a limited way when the player performance specific bad actions:
        - Allows the player to steal loot from other stalkers and incurr their wrath if spotted by them, their squad, or their faction.
        - Player can no longer shoot member of friendly faction and be ignored. Witnesses will be out for your blood for a time.

  Gameplay QoL:

    game/faster_skinning:
      name: Faster Skinning
      stage: GOLD
      desc: |
        Adds a few ways to speed up skinning without losing immersion.

        Of note is the ability to draw your knife and slash a mutant to skin it (I love the knife-draw animation, and the pistol slot feature means i can have the knife equipped at all times).

    game/exo_power:
      name: No Idle Exo Power Drain
      stage: BETA
      desc: |
        No longer drains exo power when idle, but uses more power when moving.

    game/belt_glowsticks:
      name: Glowsticks in Belt Slots
      stage: GOLD
      desc: |
        You can now drag glowsticks into a belt slot to have light with occupying a hand.

        Glowstick light intensity is reduced by 50%

        Glowstick ranges changed from 8/10/12/24m to 12/14/16/20m

    game/safety_save:
      name: Safety Saves
      stage: GOLD
      desc: |
        Adds conditional auto-saves so you don't have to spam quick/manual saves because a crash might lose your progress.

        You can refine the frequency and conditions for saving, such as no more than x min, no less than x min, after closing inventory, after healing, etc.

    game/safe_spawn:
      name: Safe Spawn
      stage: LOCAL
      desc: |
        After you load a map or fast travel, enemies ignore you for 30 seconds, or until you move or shoot. Companions hold fire too.

    gui/weapon_tooltips:
      name: Weapon Tooltips
      stage: GOLD
      desc: |
        Adds detailed weapon damage numbers and non-arbitrary statistics to weapons tooltips.
        Also makes tooltips function on the new game screen, and fixes tooltip layout issues.

        Many options for which tables/stats to show, how they're presented, whether to factor actual gun condition in, etc.

        E.g. "Accuracy: 95%" doesn't really tell me much, but "Spread: 0.32° / 6.51°" tells me exactly how accurate it is when stand-ADSing and run-hip-firing.

        Note, 1080p poors may have a hard time fitting much additional content in their tooltips, so you may want to show tables just in the details section.

    input/pda_go_away:
      name: PDA Go Away
      stage: OMIT
      desc: |
        Prevents re-raising the PDA after closing inventory, loot, trade, or fast traveling.

    input/last_equip:
      name: Last Equipped
      stage: LOCAL
      desc: |
        Auto equip last slot (toggles for each) after an event, such as closing inventory (toggles for many)

    tweaks/passive_detector_beeps:
      name: Passive Detector Beeps
      stage: GOLD
      desc: |
        Makes the artifact detector beep once every 10s when an artifact is nearby.

    tweaks/nvg_tweaks:
      name: NVG Tweaks
      stage: BETA
      desc: |
        Night vision stays on after a load or map change.

        Adds MCM option to Beef's NVGs for default gain level.

    tweaks/more_tasks:
      name: More Tasks
      stage: GOLD
      desc: |
        Simple tweaks that removes the 30% chance for NPCs to not have tasks.

  HUD:

    gui/hud_controls:
      name: HUD Controls
      stage: BETA
      desc: |
        Adds many keybinds and conditions for controlling when base-gamma hud elements are shows.

        This allows you to have most/all hud elements hidden most of the time, and shown only when you want.

        Coveres BHS (body/limb/psy/stam block, status icon, etc), minimap, and the companion ui.

    gui/stalker_id:
      name: Stalker ID
      stage: GOLD
      desc: |
        Replaces the 'Identification UI' mod.

        Centers the name/rank/icon horizontally on the screen (default top-center, can be moved vertically).

        Has many options for how and what to show ids, such as:
        - Adds better aim-tollerance, and fades last id out over time, so it's less finiky to read an id during play.
        - Optional name colors based on that NPC's individual goodwill towards you.
        - Optional line from id to target to make it easier to see who you're iding - only works on hostiles via binoculars.
        - Many controls for when to show, e.g. only when holding a key, or ADS, or using binoculars, etc.

    gui/item_labels:
      name: Item Labels
      stage: GOLD
      desc: |
        This is a very simple replacement for dotmarks for those like me who prefer the default Anomaly item labels (i.e. holding use key).

        This just shows them at all times within X meters.

        It does let you see items without LoS, but I find that this feels like a better approximation of how well I'd spot things IRL most of the time.

    gui/fx_radiation:
      name: Radiation FX
      stage: GOLD
      desc: |
        Better radiation FX that matches your current dose level rather than the environment (removing annoying grain when you're completely protected from it).

        Can also be used to disable the grain FX entirely. Many controls for fine-tuning.

    gui/fx_bleed:
      name: Bleed FX
      stage: GOLD
      desc: |
        Simple blood FX in the corner of the screen that matches your current bleed level (one corner? no biggy, 4? oh shit...).

    gui/fx_health:
      name: Health FX
      stage: GOLD
      desc: |
        Simple desaturation FX that increases in intensity as you're health drops.

    gui/pda_filters:
      name: PDA Filters
      stage: BETA
      desc: |
        Many filters for PDA messages. Some highlights (things I don't like in particular):
        - Hostile faction communications (why would they do that?).
        - Kill witness messages (no you didn't just see me kill a snork in the tunnels under agroprom...)
        - Trade brags (this is matters more for weapons ban feature - brags about buying an attachment don't really fit...)
        - Custom waypoint messages.

    tweaks/hide_geiger_screen_text:
      name: Hide Geiger Screen Text
      stage: GOLD
      desc: |
        Just hides the on-screen geiger counter "n mSv" text.

    tweaks/qaw_reorder:
      name: QAW Reorder
      stage: BETA
      desc: |
        Adds keybind for changing the order of items in the Quick Action Wheel.

        [BETA] Only tested with QAW Overhaul.

    tweaks/popup_messages:
      name: Popup Messages
      stage: GOLD
      desc: |
        Stops Popup Message from showing knife pickup when doing a quick melee.

  Inventory:

    input/inventory_controls:
      name: Inventory Controls
      stage: BETA
      desc: |
        Makes inventory controls for transfer/drop/disassemble/strip behave consistently.

        Separate binds for all stacks vs one stack.

        Optionally:
          - Uses optimal tool for disassembly (lowest condition that wont break).
          - Grants stash coords when disassembling PDAs (time saver).

    tweaks/add_sortingplus_keybinds:
      name: Add SortingPlus Keybinds
      stage: GOLD
      desc: |
        Adds keybinds to Sorting Plus for marking items as favorite/junk.

    tweaks/quest_items_all_get_icon:
      name: Quest Item Icon
      stage: BETA
      desc: |
        Makes it clearer when items are for quests.

    tweaks/hide_armor_patch_when_removed:
      name: Hide Armor Patch When Removed
      stage: GOLD
      desc: |
        Removes the patch icon from equipped armor when you have removed the patch.

  Alternate Inputs:

    input/pose_controls:
      name: Pose Controls
      stage: GOLD
      desc: |
        Adds keybinds for directly setting your pose to crouch, prone, walk, sprint. Rather than having to manually combine walk and crouch to go prone, etc.

    input/equipment_controls:
      name: Better Equipable Controls
      stage: BETA
      desc: |
        Adds keybinds for various devices which will auto-equip that items from the backpack, including:
        - Bolt
        - Torch
        - Glowstick
        - Artifact Detector
        - Geiger Counter
        - RF Scanner
        - Anomalous Measurement Device

    input/menu_controls:
      name: Menu Controls
      stage: GOLD
      desc: |
        Just adds a keybind for closing certain menus.

        (I like using tab to close menus)

    game/ammo_selector:
      name: Ammo Selector
      stage: GOLD
      desc: |
        An altered version of the base ammo selector to allow for hold-hover-release selection of ammo types.

  Balance Tweaks:

    tweaks/sane_npc_combat_speeds:
      name: Sane NPC Combat Speeds
      stage: BETA
      desc: |
        Makes NPC movement faster than Anomaly, but still slower then G.A.M.M.A. so that they don't look so rediculous.

        - Stalkers: Base Anomaly + 20%
        - ISG: Base Anomaly + 50%
        - Shambler zombies: 30% slower movement (to reduce floaty movement).

        [BETA] Haven't tested thoroughly.

    tweaks/fanatic_stays_in_cordon:
      name: Fanatic Stays In Cordon
      stage: GOLD
      desc: |
        Fanatic stays in cordon when you leave, and fail the training missions.

    tweaks/escort_tweaks:
      name: Escort Tweaks
      stage: BETA
      desc: |
        Escorts join alone instead of bringing their squad.

        Taking too long doesn't let them steal your money.

    game/campfire_healing:
      name: Campfire Healing
      stage: GOLD
      desc: |
        Faster campfire healing that also slowly converts temp limb health into permanent limb health.

        This makes the game a bit easier (which is not my goal), but I find that this makes campfires a relevant/fun mechanic, rather than a source of endured tedium.

    tweaks/opaque_bushes:
      name: Opaque Bushes
      stage: BETA
      desc: |
        Makes NPCs treat bushes as opaque, not shooting through them as much, and use them to block LoS.

        [BETA] I have found this works quite well in practice but haven't tested in detail.

  Misc:

    game/death_report:
      name: Death Report
      stage: BETA
      desc: |
        On death, press tab to see a report of the damage sources that lead to your death.

    gui/fps:
      name: FPS
      stage: GOLD
      desc: |
        Adds a configurable FPS counter or graph.

    tweaks/no_afterglow_delay:
      name: No Afterglow Delay
      stage: BETA
      desc: |
        Removes the random wait to begin the afterglow story mission.

        [BETA] I've only confirmed it working once.

    tweaks/fix_footsteps_sfx:
      name: Fix Footsteps SFX
      stage: OMIT
      desc: |
        Brutish fix for footsteps by including all the SFX and config in this mod.

        [BETA] Haven't tested all the mutants yet.

    tweaks/rf_mission_can_spawn_on_current_map:
      name: RF Mission Can Spawn On Current Map
      stage: LOCAL
      desc: |
        Make RF missions have a chance to spawn on current map.

        [BETA] Haven't actually seen it work yet.

  Performance:

    perf/mcm_runtime_read_cache:
      name: MCM Runtime Read Cache
      stage: GOLD
      desc: |
        Did you know that many mods absolutely hammer mcm read ops at runtime, wasting precious millis? For shame!

        Adds a Lua middle-man to cache mcm config reads and cache the values for 0 cost subsequent reads.

        Doesn't prevent changes to mcm config at anytime, just avoids the overhead of spamming engine calls.

    perf/sfx_prefetcher:
      name: SFX Prefetcher
      stage: GOLD
      desc: |
        Adds an SFX prefetcher that actually works.

        Run the <GAMMA>/mods/DOGMA/dogma_sfx_prefetch.py script to compile a list of small sfx files (recomment default 50kb).

        The mod will read that list on game load and preload those sfx files. Rerun script if you change audio packs, etc.

    tweaks/less_dao_gc:
      name: Less DAO Stutter
      stage: LOCAL
      desc: |
        Needs Dynamic Anomalies Overhaul.

        Reduces runtime allocations from that mod's per-anomaly updates.

  Bug Fixes:

    tweaks/fix_double_mutant_hits:
      name: Fix Double Mutant Hits
      stage: BETA
      desc: |
        Stops mutants from dealing damage twice in one hit.

        [BETA] Haven't actually tested.

    tweaks/fix_damage_limb_allocation:
      name: Fix Damage Limb Allocation
      stage: BETA
      desc: |
        Improves how BHS allocates damage from bone to limb.

        [BETA] Needs testing.

    tweaks/fix_geiger_for_dynamic_rad_patches:
      name: Fix Geiger For Dynamic Rad Patches
      stage: BETA
      desc: |
        Makes the geiger counter work with dynamic radiation patches.

        [BETA] Needs testing.

    tweaks/spawn_items_above_ground:
      name: Spawn Items Above Ground
      stage: BETA
      desc: |
        Newly spawned items start higher to stop them falling through the ground.

    tweaks/fix_artifact_weights:
      name: Fix Artifact Weights
      stage: GOLD
      desc: |
        New artifact weights taken directly from Grok github (lighter).

    tweaks/dodge_pseudogiant_slam_if_airborne:
      name: Dodge Pseudogiant Slam If Airborne
      stage: GOLD
      desc: |
        No pseudogiant slam damage when you're airborne.

    tweaks/fix_system_keybinds_not_sticking:
      name: Fix System Keybinds Not Sticking
      stage: BETA
      desc: |
        Prevents default keybinds from being applied when you unbind a system key.

        [BETA] Works well but think one or two keys may be exceptions that need special handling.

  Crash Fixes:

    tweaks/safe_atmos_visibility:
      name: Safe Atmos Visibility
      stage: GOLD
      desc: |
        Fixes atmos crash when stealth mods are disabled.

        Provides a safe vision script that keeps the core behaviour in tact.

    tweaks/fix_voiced_actor_crash:
      name: Fix Voiced Actor Crash
      stage: GOLD
      desc: |
        Stops a crash when a companion shouts.

    tweaks/fix_task_done_msg_crash:
      name: Fix Task Done Msg Crash
      stage: GOLD
      desc: |
        Stops a crash when you report a finished job and the NPC has no line.

    tweaks/fix_ammo_aggregation_crash:
      name: Fix Ammo Aggregation Crash
      stage: BETA
      desc: |
        Stops a crash when leftover ammo boxes merge.
        Can happen after you close inventory or pick up ammo.

  DEV:

    game/true_fast_travel:
      name: True Fast Travel
      stage: OMIT

    game/dogma_rules:
      name: Rules
      stage: OMIT
